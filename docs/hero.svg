<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Payments from Base, Arbitrum, Ethereum, Tron and Bitcoin flow through Sluice into the merchant's USDC on Solana">
<style>
.b{fill:#fff;stroke:#cfdbd7}.t{font:600 19px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#10201e}.s{font:600 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#55635f}
.g{fill:#0c6b63}.w{font:700 21px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#fff}.p{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 10}
@media (prefers-color-scheme:dark){.b{fill:#131c1a;stroke:#26332f}.t{fill:#e8efed}.s{fill:#a0afab}.g{fill:#3fd0bd}.w{fill:#06201c}}
</style>
<g class="p">
<path stroke="#0052ff" d="M164 34C230 34 230 150 318 150"/><path stroke="#28a0f0" d="M164 92C220 92 230 150 318 150"/><path stroke="#7a86d6" d="M164 150H318"/><path stroke="#ef0027" d="M164 208C220 208 230 150 318 150"/><path stroke="#f7931a" d="M164 266C230 266 230 150 318 150"/>
<path stroke="#14b8a6" d="M450 150H538" stroke-width="6"/>
</g>
<g><rect class="b" x="6" y="12" width="158" height="44" rx="22"/><circle cx="32" cy="34" r="10" fill="#0052ff"/><text class="t" x="50" y="41">Base</text>
<rect class="b" x="6" y="70" width="158" height="44" rx="22"/><circle cx="32" cy="92" r="10" fill="#28a0f0"/><text class="t" x="50" y="99">Arbitrum</text>
<rect class="b" x="6" y="128" width="158" height="44" rx="22"/><circle cx="32" cy="150" r="10" fill="#7a86d6"/><text class="t" x="50" y="157">Ethereum</text>
<rect class="b" x="6" y="186" width="158" height="44" rx="22"/><circle cx="32" cy="208" r="10" fill="#ef0027"/><text class="t" x="50" y="215">Tron</text>
<rect class="b" x="6" y="244" width="158" height="44" rx="22"/><circle cx="32" cy="266" r="10" fill="#f7931a"/><text class="t" x="50" y="273">Bitcoin</text></g>
<rect class="g" x="318" y="102" width="132" height="96" rx="20"/><text class="w" x="384" y="146" text-anchor="middle">Sluice</text><text class="w" x="384" y="172" text-anchor="middle" style="font-size:14px;font-weight:600">checks on Solana</text>
<rect class="b" x="538" y="96" width="176" height="108" rx="18"/><text class="t" x="626" y="134" text-anchor="middle">Merchant</text><text class="s" x="626" y="160" text-anchor="middle">USDC on Solana</text><text class="s" x="626" y="182" text-anchor="middle">or earning in Kamino</text>
</svg>
